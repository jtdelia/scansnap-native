name: Agent task

# Add the "agent-ready" label to a build task issue to have OpenCode implement it.
# The agent opens a draft pull request that closes the issue. Marking it ready for
# review starts the AI review. Remove and re-add the label to try again.
on:
  issues:
    types: [labeled]

concurrency:
  group: agent-task-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  implement:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      ISSUE: ${{ github.event.issue.number }}
      # The agent edits files and runs the project's checks. Pushing and opening the pull
      # request happen after it finishes, outside its control. The last matching rule
      # wins. Subagents are denied because built-in ones bring their own shell rules,
      # execute (Code Mode) because its scripts can reach the network, and git flags and
      # shell redirects that read outside the checkout or write files.
      OPENCODE_CONFIG_CONTENT: >-
        {"permissions": [
          {"action": "webfetch", "resource": "*", "effect": "deny"},
          {"action": "websearch", "resource": "*", "effect": "deny"},
          {"action": "subagent", "resource": "*", "effect": "deny"},
          {"action": "execute", "resource": "*", "effect": "deny"},
          {"action": "question", "resource": "*", "effect": "deny"},
          {"action": "external_directory", "resource": "*", "effect": "deny"},
          {"action": "shell", "resource": "*", "effect": "deny"},
          {"action": "shell", "resource": "make lint *", "effect": "allow"},
          {"action": "shell", "resource": "make test *", "effect": "allow"},
          {"action": "shell", "resource": "make build *", "effect": "allow"},
          {"action": "shell", "resource": "make check *", "effect": "allow"},
          {"action": "shell", "resource": "git status *", "effect": "allow"},
          {"action": "shell", "resource": "git diff *", "effect": "allow"},
          {"action": "shell", "resource": "git log *", "effect": "allow"},
          {"action": "shell", "resource": "git show *", "effect": "allow"},
          {"action": "shell", "resource": "git * --no-index*", "effect": "deny"},
          {"action": "shell", "resource": "git * --output*", "effect": "deny"},
          {"action": "shell", "resource": "*>*", "effect": "deny"}]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check blocking issues
        id: blockers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ github.event.issue.body }}
        run: |
          listed=$(printf '%s\n' "$BODY" \
            | awk '/^### Blocked by/ {on=1; next} /^### / {on=0} on' \
            | grep -oE '#[0-9]+' | tr -d '#' || true)
          linked=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/dependencies/blocked_by" \
            --jq '.[].number' 2>/dev/null || true)
          open=()
          for n in $(printf '%s\n%s\n' "$listed" "$linked" | sort -un); do
            if [ "$(gh issue view "$n" --json state --jq .state)" = "OPEN" ]; then open+=("#$n"); fi
          done
          if [ "${#open[@]}" -gt 0 ]; then
            gh issue comment "$ISSUE" --body "Not starting: still blocked by ${open[*]}. Re-add \`agent-ready\` once they are closed."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get a token for the agent app
        id: app
        if: steps.blockers.outputs.blocked != 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Report that the agent app is not set up
        if: steps.app.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE" --body "Not starting: the agent GitHub app is not set up for this repository. See \"Create the agent GitHub app\" in docs/TEMPLATE_SETUP.md, then re-add \`agent-ready\`."
          exit 1

      - name: Push and commit as the agent app
        if: steps.app.outcome == 'success'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(GH_TOKEN="$TOKEN" gh api "users/$SLUG%5Bbot%5D" --jq .id)
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git config --global user.name "${SLUG}[bot]"
          git config --global user.email "$id+${SLUG}[bot]@users.noreply.github.com"

      - id: model
        if: steps.blockers.outputs.blocked != 'true'
        uses: ./.github/actions/pick-free-model

      - name: Report that no model is available
        if: steps.blockers.outputs.blocked != 'true' && steps.model.outputs.primary == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE" --body "No free OpenCode model is available right now. Re-add \`agent-ready\` to try again later."

      - name: Load the task prompt
        id: prompt
        if: steps.model.outputs.primary != ''
        run: |
          {
            echo 'text<<PROMPT_EOF'
            cat .github/opencode/task-prompt.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Implement with the best free model
        id: primary
        if: steps.model.outputs.primary != ''
        continue-on-error: true
        timeout-minutes: 25
        uses: ./.github/actions/run-opencode
        with:
          model: ${{ steps.model.outputs.primary }}
          token: ${{ steps.app.outputs.token }}
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Retry with the next free model
        id: fallback
        if: steps.primary.outcome == 'failure' && steps.model.outputs.fallback != ''
        continue-on-error: true
        timeout-minutes: 25
        uses: ./.github/actions/run-opencode
        with:
          model: ${{ steps.model.outputs.fallback }}
          token: ${{ steps.app.outputs.token }}
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Make the pull request a draft with a conventional title
        if: steps.primary.outcome == 'success' || steps.fallback.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ github.event.issue.body }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          pr=$(gh pr list --state open --json number,headRefName \
            --jq "map(select(.headRefName | startswith(\"opencode/issue${ISSUE}-\"))) | .[0].number // empty")
          if [ -z "$pr" ]; then
            echo "The agent made no changes, so there is no pull request."
            exit 0
          fi
          type=$(printf '%s\n' "$BODY" | awk '/^### Change type/ {on=1; next} /^### / {on=0} on && NF {print; exit}')
          if ! printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([^)]+\))?!?: '; then
            TITLE="${type:-feat}: $TITLE"
          fi
          gh pr ready "$pr" --undo
          gh pr edit "$pr" --title "$TITLE"

      - name: Remove the agent-ready label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit "$ISSUE" --remove-label agent-ready

      - name: Fail if the agent did not run
        if: steps.model.outputs.primary != '' && steps.primary.outcome != 'success' && steps.fallback.outcome != 'success'
        run: exit 1
