name: OpenCode

# Comment "/oc <request>" (or "/opencode <request>") on an issue, a pull request, or a
# line of a pull request diff. Only the repository owner, members, and collaborators can
# trigger it. Examples: "/oc explain this issue", "/oc fix the failing test".
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  opencode:
    if: >-
      (startsWith(github.event.comment.body, '/oc') || contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/opencode') || contains(github.event.comment.body, ' /opencode')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      # The agent edits files and runs the project's checks. Pushing and opening pull
      # requests happen after it finishes, outside its control. The last matching rule
      # wins. Subagents are denied because built-in ones bring their own shell rules,
      # execute (Code Mode) because its scripts can reach the network, and git flags and
      # shell redirects that read outside the checkout or write files.
      OPENCODE_CONFIG_CONTENT: >-
        {"permissions": [
          {"action": "webfetch", "resource": "*", "effect": "deny"},
          {"action": "websearch", "resource": "*", "effect": "deny"},
          {"action": "subagent", "resource": "*", "effect": "deny"},
          {"action": "execute", "resource": "*", "effect": "deny"},
          {"action": "question", "resource": "*", "effect": "deny"},
          {"action": "external_directory", "resource": "*", "effect": "deny"},
          {"action": "shell", "resource": "*", "effect": "deny"},
          {"action": "shell", "resource": "make lint *", "effect": "allow"},
          {"action": "shell", "resource": "make test *", "effect": "allow"},
          {"action": "shell", "resource": "make build *", "effect": "allow"},
          {"action": "shell", "resource": "make check *", "effect": "allow"},
          {"action": "shell", "resource": "git status *", "effect": "allow"},
          {"action": "shell", "resource": "git diff *", "effect": "allow"},
          {"action": "shell", "resource": "git log *", "effect": "allow"},
          {"action": "shell", "resource": "git show *", "effect": "allow"},
          {"action": "shell", "resource": "git * --no-index*", "effect": "deny"},
          {"action": "shell", "resource": "git * --output*", "effect": "deny"},
          {"action": "shell", "resource": "*>*", "effect": "deny"}]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get a token for the agent app
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          # On a pull request, replies and reactions only need pull request access.
          permission-issues: ${{ (github.event.pull_request || github.event.issue.pull_request) && 'read' || 'write' }}
          permission-pull-requests: write

      - name: Report that the agent app is not set up
        if: steps.app.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$NUMBER" --body "OpenCode cannot run because the agent GitHub app is not set up for this repository. See \"Create the agent GitHub app\" in docs/TEMPLATE_SETUP.md, then comment again."
          exit 1

      - name: Push and commit as the agent app
        if: steps.app.outcome == 'success'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(GH_TOKEN="$TOKEN" gh api "users/$SLUG%5Bbot%5D" --jq .id)
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git config --global user.name "${SLUG}[bot]"
          git config --global user.email "$id+${SLUG}[bot]@users.noreply.github.com"

      - id: model
        uses: ./.github/actions/pick-free-model

      - name: Report that no model is available
        if: steps.model.outputs.primary == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$NUMBER" --body "No free OpenCode model is available right now, so this request was not run. Try again later."
          exit 1

      - name: Run with the best free model
        id: primary
        continue-on-error: true
        timeout-minutes: 25
        uses: ./.github/actions/run-opencode
        with:
          model: ${{ steps.model.outputs.primary }}
          token: ${{ steps.app.outputs.token }}

      - name: Retry with the next free model
        if: steps.primary.outcome == 'failure' && steps.model.outputs.fallback != ''
        timeout-minutes: 25
        uses: ./.github/actions/run-opencode
        with:
          model: ${{ steps.model.outputs.fallback }}
          token: ${{ steps.app.outputs.token }}

      - name: Fail if no model succeeded
        if: steps.primary.outcome == 'failure' && steps.model.outputs.fallback == ''
        run: exit 1
